<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Practice</title>
</head>
<body>
  <h1>PM2.5 to AQI</h1>
  <p>NowCast (ug/m3): <input id="conc" value="11.1"></p> 
  <button onclick="calculate()">Calculate</button>
  <p>AQI: <span id="result"></span></p>
  <script>
    // EPA PM2.5 tabe: [C_lo, C_hi, AQI_lo, AQI_hi]
    var rows = [
      [0.0, 9.0, 0, 50],
      [9.1, 35.4, 51, 100],
      [35.5, 55.4, 101, 150],
      [55.5, 125.4, 151, 200],
      [125.5, 225.4, 201, 300],
      [225.5, 325.4, 301, 500]
    ];

    function calculate() { 
      var c = parseFloat(document.getElementById("conc").value);

      for (var i = 0; i <rows.length; i++)  {
        var r = rows[i];
        if (c <= r[1]) {
          var aqi = (r[3] - r[2]) / (r[1] - r[0]) * (c - r[0]) + r[2];
          document.getElementById("result").textContent = Math.round(aqi);
          return;
        }
      }
      document.getElementById("result").textContent ="Above 500";
    }    
  </script>
</body>
</html>
