<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Barlow", Arial, sans-serif;
      background: #f4f6f8;
      color: #222222;
      max-width: 400px;
      margin: 40px auto;
    }
    h1 {
      color: #1a4d7a;
    }
    input {
      font-size: 18px;
      padding: 6px;
      width: 100px;
    }
    button {
      background: #1a4d7a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    #result {
      font-size: 48px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>PM2.5 to AQI</h1>
  <p>NowCast (ug/m3): <input id="conc" value="11.1"></p> 
  <button onclick="calculate()">Calculate</button>
  <p>AQI: <span id="result"></span></p>
  <script>
    // EPA PM2.5 tabe: [C_lo, C_hi, AQI_lo, AQI_hi]
    var rows = [
      [0.0, 9.0, 0, 50],
      [9.1, 35.4, 51, 100],
      [35.5, 55.4, 101, 150],
      [55.5, 125.4, 151, 200],
      [125.5, 225.4, 201, 300],
      [225.5, 325.4, 301, 500]
    ];

    function calculate() { 
      var c = parseFloat(document.getElementById("conc").value);

      for (var i = 0; i <rows.length; i++)  {
        var r = rows[i];
        if (c <= r[1]) {
          var aqi = (r[3] - r[2]) / (r[1] - r[0]) * (c - r[0]) + r[2];
          document.getElementById("result").textContent = Math.round(aqi);
          return;
        }
      }
      document.getElementById("result").textContent ="Above 500";
    }    
  </script>
</body>
</html>
