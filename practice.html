<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Practice</title>
</head>
<body>
  <h1>PM2.5 to AQI</h1>
  <p>NowCast (ug/m3): <input id="conc" value="11.1"></p> 
  <button onclick="calculate()">Calculate</button>
  <p>AQI: <span id="result"></span></p>
  <script>
    function calculate() {
      var c = parseFloat(document.getElementById("conc").value);
      // Moderate row: 9.1-35.4 ug/m3 is AQI 51-100
      var aqi = (100 - 51) / (35.4 - 9.1) * (c - 9.1) + 51
      document.getElementById("result").textContent = Math.round(aqi);
    } 
  </script>
</body>
</html>
